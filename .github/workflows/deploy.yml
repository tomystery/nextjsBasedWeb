name: Next.js CI/CD to AWS ECS

on:
  push:
    branches:
      - main # 监听 main 分支的合并与推送

permissions:
  id-token: write # 必须：用于 AWS OIDC 免密认证
  contents: read  # 必须：用于 checkout 代码

env:
  AWS_REGION: ap-southeast-2 # 悉尼节点（如奥克兰则填 ap-southeast-6）
  ECR_REPOSITORY: nextjs/test-image-sass # 你的 ECR 仓库名
  ECS_SERVICE: nextjs-image-sass-service # 你的 ECS 服务名称
  ECS_CLUSTER: sass-image # 你的 ECS 集群名称
  CONTAINER_NAME: nextjs-image-sass # 任务定义中的容器名称
  ECS_TASK_FAMILY: nextjs-image-sass

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 核心修复：优先安装 pnpm
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.1.2
          run_install: false

      # 2. 配置 Node.js 与依赖缓存
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: 'pnpm'

      # 3. 持续集成检查（代码质量与测试）
      - name: Install dependencies & run checks
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          # 若后续有单元测试，取消下行注释即可：
          # pnpm test

      # === 【在这里插入诊断步骤】：打印 GitHub 真实 OIDC 令牌 payload 进行诊断 ===
      - name: Inspect GitHub OIDC Token
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "=== 解码 GitHub 实际发送给 AWS 的数据 ==="
          python3 -c "import jwt, json; print(json.dumps(jwt.decode('$TOKEN', options={'verify_signature': False}), indent=2))"

      # 4. 基于 OIDC 免密登录 AWS
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 5. 构建并推送 Docker 镜像（针对你的 ARM64 架构）
      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --platform linux/arm64 -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # 6. 【核心步骤】：直接从云端 ECS 拉取当前运行中的最新任务定义
      - name: Download active task definition from ECS
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_TASK_FAMILY }} \
            --query taskDefinition > task-def.json

      # 7. 渲染更新：将刚构建出的新镜像 Tag 注入下载的 JSON
      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json # 动态生成的临时文件，不会进 git 历史
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      # 8. 部署发布：更新任务定义并执行无缝滚动发布
      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true